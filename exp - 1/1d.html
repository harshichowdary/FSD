<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thumbnail Image Gallery</title>
</head>
<body>

    <h1 style="text-align:center;">Image Gallery with Thumbnails</h1>

    <center>
        <div class="gallery">
            <a href="aaa.jpg" target="_blank" rel="noopener noreferrer">
                <img src="aaa.jpg" alt="Image 1" height="100" width="100">
            </a>
            <a href="bbb.jpg" target="_blank" rel="noopener noreferrer">
                <img src="bbb.jpg" alt="Image 2" height="100" width="100">
            </a>
            <a href="ccc.jpg" target="_blank" rel="noopener noreferrer">
                <img src="ccc.jpg" alt="Image 3" height="100" width="100">
            </a>
        </div>
    </center>

</body>
</html>
