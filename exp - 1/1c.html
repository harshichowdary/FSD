<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .profile-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* space between profiles */
            /* flex-direction: row is default, so no need to specify */
        }
        .profile {
            text-align: center;
        }
        .profile a {
            text-decoration: none;
            color: #333;
            display: block;
        }
        .profile img {
            border-radius: 10px;
            transition: transform 0.3s ease;
            cursor: pointer;
            width: 200px;
            height: 300px;
            object-fit: cover;
            display: block;
            margin: 0 auto 10px;
        }
        .profile a:hover img {
            transform: scale(1.05);
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Click on the Images to Visit Profiles</h1>
    
    <div class="profile-container">

        <div class="profile">
            <a href="https://www.linkedin.com/in/uppluri-yasasri-797817278" target="_blank" rel="noopener noreferrer">
                <img src="yyyyy.jpg" alt="Profile photo of Yasasri Uppluri" />
                <p>YASASRI</p>
            </a>
        </div>

        <div class="profile">
            <a href="https://www.example.com/friend-profile" target="_blank" rel="noopener noreferrer">
                <img src="hemaa.jpeg" alt="Profile photo of Hema Latha" />
                <p>HEMA LATHA</p>
            </a>
        </div>

    </div>

</body>
</html>
