<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Frames-Like Example (Table)</title>
</head>
<body>

  <h2 align="center">Frames Example (Table Layout)</h2>

  <table border="1" width="100%" cellpadding="8" cellspacing="0">
    <tr>
      <td>
        <h3>Frame 1: Image</h3>
        <img src="https://www.beautifulworld.com/wp-content/uploads/2024/04/waterfalls.jpeg" alt="Sample Image" width="300" height="200">
      </td>
    </tr>

    <tr>
      <td>
        <h3>Frame 2: Paragraph</h3>
        <p>
          This is a sample paragraph inside the second section.
          Frames divide the page into different sections, and each can display its own content.
        </p>
      </td>
    </tr>

    <tr>
      <td>
        <h3>Frame 3: Hyperlink</h3>
        <a href="https://www.w3schools.com/html/html_links.asp" target="_blank">Visit Example Website</a>
      </td>
    </tr>
  </table>

</body>
</html>
