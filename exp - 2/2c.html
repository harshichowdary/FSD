<!DOCTYPE html>
<html>
<head>
  <title>Registration Form Example</title>
</head>
<body>

  <h2 align="center">Student Registration Form</h2>

  <form>
    <center> 
    <table border="1" cellpadding="8" cellspacing="5">
      <caption><b>Fill Your Details</b></caption>

      
      <tr>
        <td>Full Name:</td>
        <td><input type="text" name="fullname" placeholder="Enter your name"></td>
      </tr>

      
      <tr>
        <td>Password:</td>
        <td><input type="password" name="password" placeholder="Enter password"></td>
      </tr>

      
      <tr>
        <td>Age:</td>
        <td><input type="number" name="age" min="1" max="100"></td>
      </tr>

      
      <tr>
        <td>Date of Birth:</td>
        <td><input type="date" name="dob"></td>
      </tr>

      
      <tr>
        <td>Gender:</td>
        <td>
          <input type="radio" name="gender" value="male"> Male
          <input type="radio" name="gender" value="female"> Female
          <input type="radio" name="gender" value="other"> Other
        </td>
      </tr>

      
      <tr>
        <td>Hobbies:</td>
        <td>
          <input type="checkbox" name="hobby" value="reading"> Reading
          <input type="checkbox" name="hobby" value="sports"> Sports
          <input type="checkbox" name="hobby" value="music"> Music
        </td>
      </tr>
