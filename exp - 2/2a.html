<!DOCTYPE html>
<html>
<head>
  <title>Simple Table Example</title>
</head>
<body>

  <h2>Student Marks Table</h2>

  <table border="1">
    
    <tr>
      <th>Name</th>
      <th colspan="2">Subjects</th>
      <th>Marks</th>
    </tr>

   
    <tr>
      <td>Alice</td>
      <td>Math</td>
      <td>Science</td>
      <td>85</td>
    </tr>


    <tr>
      <td rowspan="2">Bob</td>
      <td>Math</td>
      <td>—</td>
      <td>90</td>
    </tr>
    <tr>
      
      <td>Science</td>
      <td>—</td>
      <td>88</td>
    </tr>
  </table>

</body>
</html>
