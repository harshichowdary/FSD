<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Styles Example</title>

  
  <style>
   
    h2 {
      color: green;
    }

    
    p.internal {
      font-size: 18px;
    }
  </style>


  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Example of CSS Styles</h2>
<!-- Inline CSS -->
  <p style="color: blue; font-weight: bold;">
    This paragraph uses <b>inline CSS</b>.
    
  </p>

 
  <p class="internal">
    This paragraph uses <b>internal CSS</b>.
  </p>

  
  <p class="external">
    This paragraph uses <b>external CSS</b>.
  </p>

</body>
</html>
