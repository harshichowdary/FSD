<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 and CSS Example</title>

  
  <style>
    header, footer {
      background-color: lightgray;
      text-align: center;
      padding: 10px;
    }
    nav {
      background-color: #f0f0f0;
      padding: 5px;
    }
    article {
      margin: 10px;
      padding: 10px;
      background-color: #fafafa;
    }
    aside {
      background-color: #e0e0e0;
      padding: 10px;
      margin: 10px;
    }
    figcaption {
      font-style: italic;
      text-align: center;
    }
  </style>

  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  
  <header>
    <h1>My Website</h1>
  </header>

 
  <nav>
    
    <a href="#" style="color: blue;">Home</a> |
    <a href="#">About</a> |
    <a href="#">Contact</a>
  </nav>

  
  <main>
    <article>
      <section>
        <h2>Article Section</h2>
      </section>

      <section>
        <h2>Figure Example</h2>
        <figure>
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiuINjHNX_c2Bz-hlG-aaMJJPPe6KoHQs63Q&s" alt="Sample Image" width="300" height="200">
          <figcaption>A sample image</figcaption>
        </figure>
      </section>
    </article>

    <aside>
      <h3>Aside Section</h3>
      <p>This is an <span style="color:green;">aside</span> note.</p>
    </aside>
  </main>

  
  <div>
    <p>This is inside a <span style="font-weight:bold;">div</span> container.</p>
  </div>

 
  <footer>
    <p>&copy; Thankyou for visting my Website</p>
  </footer>

</body>
</html>
