<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio and Video Example</title>
</head>
<body>

  <h2 align="center">Embedding Audio and Video in HTML</h2>

  
  <h3>Audio Example</h3>
  <audio controls>
    <source src="sample-audio.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <br><br>

  
  <h3>Video Example </h3>
  <iframe width="560" height="315" 
          src="https://www.youtube.com/embed/GMniyQIc1eU" 
          title="TOM VE JERRY | Çifte Kovalamaca | #YENİ ŞOV | @cartoonnetworkturkiye" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
  </iframe>

</body>
</html>
