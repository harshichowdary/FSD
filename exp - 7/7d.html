<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Math Example</title>
</head>
<body>
    <h2>Using Math Object in JavaScript</h2>
    <p id="mathInfo"></p>

    <script>
        let piValue = Math.PI;                   
        let squareRoot = Math.sqrt(25);           
        let powerValue = Math.pow(2, 4);          
        let randomNum = Math.random();           
        let roundedValue = Math.round(4.7);      
        document.getElementById("mathInfo").innerHTML =
            "Value of PI: " + piValue + "<br>" +
            "Square Root of 25: " + squareRoot + "<br>" +
            "2 raised to power 4: " + powerValue + "<br>" +
            "Random Number: " + randomNum + "<br>" +
            "Rounded Value of 4.7: " + roundedValue + "<br>" +
            "Visit for more info: <a href='https://www.w3schools.com/js/js_syntax.asp' target='_blank'>JavaScript Tutorial</a>";
    </script>
</body>
</html>
