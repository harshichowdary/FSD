<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Box Model Example</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }

   
    .box {
      width: 300px;               
      padding: 20px;              
      border: 5px solid blue;     
      margin: 30px auto;         
      background-color: lightyellow;
    }

    
    .label {
      font-weight: bold;
      color: darkred;
    }
  </style>
</head>
<body>

  <h2>CSS Box Model Demo</h2>

  <div class="box">
    <p><span class="label">Content:</span> This is the content of the box.</p>
    <p><span class="label">Padding:</span> Space between content and border.</p>
    <p><span class="label">Border:</span> Blue border surrounding the padding.</p>
    <p><span class="label">Margin:</span> Space outside the border.</p>
  </div>

  

</body>
</html>
