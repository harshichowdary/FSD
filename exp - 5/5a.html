<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Color Reference Example</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }

    
    .named-color {
      color: red; 
      background-color: lightyellow;
      padding: 10px;
      margin: 10px;
    }

    
    .hex-color {
      color: #00FF00; 
      background-color: #F0F8FF; 
      padding: 10px;
      margin: 10px;
    }

    
    .rgb-color {
      color: rgb(0,0,255); 
      background-color: rgb(240, 240, 240);
      padding: 10px;
      margin: 10px;
    }

    
    .rgba-color {
      color: rgba(255,0,0,0.7); 
      background-color: rgba(0,255,0,0.2); 
      padding: 10px;
      margin: 10px;
    }

   
    .hsl-color {
      color: hsl(240,100%,50%); 
      background-color: hsl(60,100%,90%); 
      padding: 10px;
      margin: 10px;
    }

    
    .box-model {
      width: 300px;
      border: 3px solid black;
      padding: 10px;
      margin: 20px auto;
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <h2>CSS Color Reference Demo</h2>

  <div class="named-color">Flowers are blooming in the garden</div>
  <div class="hex-color">Water fall <b>are very beautifull</b></div>
  <div class="rgb-color">Water is flowing fast down the rocks</div>
  <div class="rgba-color">The forest is green and quiet.</div>
  

  
  <div class="box-model">
    <p>This box demonstrates the <b>CSS box model</b>:</p>
    <ul>
      <li>Width: 300px</li>
      <li>Padding: 10px</li>
      <li>Border: 3px solid black</li>
      <li>Margin: 20px</li>
    </ul>
  </div>

</body>
</html>
